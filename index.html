<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Club Defensores del Azul - Institución Educativa Pueblo Rico, Neira, Caldas. Conocemos, investigamos y protegemos el agua.">
<title>Club Defensores del Azul</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  line-height:1.6;
  color:#17324d;
  background:#f4fbfd;
}

header{
  background:linear-gradient(135deg,#006994,#00a8cc,#38b48b);
  color:white;
  padding:55px 20px;
  text-align:center;
}

header .logo{
  font-size:4rem;
  margin-bottom:10px;
}

header h1{
  font-size:clamp(2rem,6vw,4rem);
  margin-bottom:10px;
}

header p{
  max-width:850px;
  margin:auto;
  font-size:1.15rem;
}

nav{
  position:sticky;
  top:0;
  z-index:1000;
  background:#063b57;
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  box-shadow:0 3px 10px #0003;
}

nav a{
  color:white;
  text-decoration:none;
  padding:14px 18px;
  font-weight:bold;
}

nav a:hover{
  background:#087fa5;
}

.container{
  width:min(1100px,92%);
  margin:auto;
}

section{
  padding:60px 0;
}

section h2{
  text-align:center;
  color:#006994;
  font-size:2rem;
  margin-bottom:35px;
}

.hero{
  background:white;
  text-align:center;
  padding:65px 20px;
}

.hero h2{
  font-size:2.3rem;
  margin-bottom:20px;
}

.hero p{
  max-width:850px;
  margin:auto;
  font-size:1.15rem;
}

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
  gap:22px;
}

.card{
  background:white;
  border-radius:18px;
  padding:28px;
  box-shadow:0 5px 18px #063b5718;
  border-top:5px solid #00a8cc;
  transition:.25s;
}

.card:hover{
  transform:translateY(-5px);
}

.card .icon{
  font-size:2.5rem;
  margin-bottom:12px;
}

.card h3{
  color:#006994;
  margin-bottom:10px;
}

.highlight{
  background:#e2f7f5;
}

.data-box{
  background:#063b57;
  color:white;
  border-radius:20px;
  padding:35px;
  margin-top:25px;
}

.data-box h3{
  color:#8ce6d0;
  margin-bottom:15px;
}

.steps{
  counter-reset:paso;
}

.step{
  background:white;
  padding:25px;
  margin-bottom:18px;
  border-radius:15px;
  position:relative;
  padding-left:75px;
  box-shadow:0 4px 15px #00000012;
}

.step:before{
  counter-increment:paso;
  content:counter(paso);
  position:absolute;
  left:20px;
  top:20px;
  width:38px;
  height:38px;
  border-radius:50%;
  background:#00a8cc;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
}

.gallery{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:18px;
}

.photo{
  min-height:180px;
  border-radius:18px;
  background:linear-gradient(135deg,#b9e8ef,#7bd1c2);
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:20px;
  color:#06425e;
  font-weight:bold;
}

.cta{
  background:linear-gradient(135deg,#006994,#063b57);
  color:white;
  text-align:center;
  border-radius:25px;
  padding:45px 25px;
}

.cta h2{
  color:white;
}

.button{
  display:inline-block;
  margin-top:20px;
  padding:13px 25px;
  background:#38b48b;
  color:white;
  text-decoration:none;
  border-radius:30px;
  font-weight:bold;
}

footer{
  background:#032638;
  color:white;
  text-align:center;
  padding:35px 20px;
}

footer p{
  margin:7px 0;
}

@media(max-width:600px){
  nav a{
    padding:10px 9px;
    font-size:.88rem;
  }

  section{
    padding:45px 0;
  }

  header{
    padding:40px 15px;
  }

  .step{
    padding-left:65px;
  }
}
</style>
</head>

<body>

<header id="inicio">
  <div class="logo">💧🌿</div>
  <h1>Club Defensores del Azul</h1>
  <p>Del territorio al dato: conocemos, investigamos y protegemos el agua.</p>
  <p>Institución Educativa Pueblo Rico · Neira · Caldas</p>
</header>

<nav>
  <a href="#inicio">Inicio</a>
  <a href="#club">El Club</a>
  <a href="#territorio">Territorio</a>
  <a href="#agua">Agua</a>
  <a href="#datos">Datos</a>
  <a href="#biodiversidad">Biodiversidad</a>
  <a href="#galeria">Galería</a>
  <a href="#aliados">Aliados</a>
</nav>

<section class="hero">
  <div class="container">
